# ==================================================================
# Variance Only Preprocessing Configuration
# ==================================================================
# Just filter and scale, no dimensionality reduction
# Best for: Interpretability, feature importance analysis
# ==================================================================

enabled: true
cache: true

methods:
  # Step 1: Remove low-variance features
  - type: variance_threshold
    threshold: 0.01
  
  # Step 2: Standardize features
  - type: scaling
    method: standard
  
  # No PCA! Keep all remaining original features

# Expected results:
# - Input: ~150 features → Output: ~140 features (after variance filter)
# - All original features preserved
# - Speed: Fast
# - Use case: Feature importance, interpretability
# - Trade-off: More features = slower training
