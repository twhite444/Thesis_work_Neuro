# ==================================================================
# Large Neural Network Configuration
# ==================================================================
# Best for: Complex patterns, final training, publication
# Training time: ~1-2 minutes
# Capacity: High (risk of overfitting on small data)
# ==================================================================

name: large_neural_network

type: feedforward

architecture:
  hidden_layers: [256, 128, 64, 32]  # 4 layers: 256 → 128 → 64 → 32
  activation: relu
  dropout: 0.4  # Strong regularization to prevent overfitting
  batch_norm: false

optimizer:
  type: adam
  learning_rate: 0.0005  # Lower LR for stability with larger model
  weight_decay: 0.0001  # L2 regularization

loss: mse

# Expected performance:
# - Training: Slow (~90 sec/epoch)
# - Capacity: Maximum
# - Use case: Final experiments, when you need max capacity
# - Warning: May overfit on small datasets!
