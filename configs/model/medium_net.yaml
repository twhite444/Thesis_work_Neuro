# ==================================================================
# Medium Neural Network Configuration
# ==================================================================
# Best for: Standard experiments, balanced performance
# Training time: ~30-60 seconds
# Capacity: Moderate (good for most tasks)
# ==================================================================

name: medium_neural_network

type: feedforward

architecture:
  hidden_layers: [128, 64, 32]  # 3 layers: 128 → 64 → 32 neurons
  activation: relu
  dropout: 0.3  # Moderate regularization
  batch_norm: false

optimizer:
  type: adam
  learning_rate: 0.001
  weight_decay: 0.0

loss: mse

# Expected performance:
# - Training: Moderate (~45 sec/epoch)
# - Capacity: Good balance
# - Use case: Most experiments, recommended starting point
