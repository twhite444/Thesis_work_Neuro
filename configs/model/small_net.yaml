# ==================================================================
# Small Neural Network Configuration
# ==================================================================
# Best for: Quick tests, debugging, fast iteration
# Training time: ~15-30 seconds
# Capacity: Low (may underfit on complex data)
# ==================================================================

name: small_neural_network

type: feedforward

architecture:
  hidden_layers: [64, 32]  # 2 layers: 64 → 32 neurons
  activation: relu
  dropout: 0.2  # Light regularization
  batch_norm: false

optimizer:
  type: adam
  learning_rate: 0.001
  weight_decay: 0.0

loss: mse

# Expected performance:
# - Training: Fast (~20 sec/epoch)
# - Capacity: Limited
# - Use case: Quick experiments, testing pipeline
