# ==================================================================
# Quick Test Training Configuration
# ==================================================================
# Minimal training for testing pipeline and debugging
# Total time: ~1-2 minutes
# ==================================================================

max_epochs: 10  # Very short training

early_stopping:
  enabled: true
  monitor: val_loss
  patience: 3  # Stop early if no improvement
  min_delta: 0.001
  mode: min

checkpointing:
  enabled: false  # Don't save checkpoints for quick tests
  
accelerator: auto  # Use GPU if available
devices: 1
precision: 32  # Standard precision

gradient_clip_val: 1.0
accumulate_grad_batches: 1

# Use case:
# - Testing if code works
# - Debugging errors
# - Quick sanity checks
# - NOT for actual experiments!
