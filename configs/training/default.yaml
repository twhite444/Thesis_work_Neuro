# ==================================================================
# Default Training Configuration
# ==================================================================
# Standard training for most experiments
# Total time: ~5-10 minutes (with early stopping)
# ==================================================================

max_epochs: 100  # Maximum epochs

early_stopping:
  enabled: true
  monitor: val_loss
  patience: 15  # Stop after 15 epochs without improvement
  min_delta: 0.0001
  mode: min

checkpointing:
  enabled: true
  monitor: val_loss
  save_top_k: 3  # Keep best 3 models
  mode: min
  
accelerator: auto  # Automatically use GPU if available
devices: 1
precision: 32  # Standard precision (use 16 for 2x speedup)

gradient_clip_val: 1.0
accumulate_grad_batches: 1

# Use case:
# - Standard experiments
# - Most research work
# - Balanced speed/quality
