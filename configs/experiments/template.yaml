# ==================================================================
# EXPERIMENT TEMPLATE
# ==================================================================
# Copy this file to create new experiments:
#   cp configs/experiments/template.yaml configs/experiments/my_experiment.yaml
#
# Then edit the sections below for your specific experiment.
# Only change what you need - everything else uses sensible defaults.
# ==================================================================

# Give your experiment a name
experiment_name: template

# ==================================================================
# STAGE 1: Feature Extraction
# ==================================================================
# Convert SMILES molecules to numerical descriptors
# ⏱️  Takes: 5-10 minutes (run once, then cached forever)
# ==================================================================

feature_extraction:
  # Input: CSV file with SMILES column
  smiles_file: "data/00_raw/olfactory_v1.csv"
  smiles_column: "SMILES"
  
  # Target column (what we're predicting)
  target_column: "Target"
  
  # RDKit descriptors to compute (leave as-is unless you know what you're doing)
  descriptors:
    - "all"  # Computes all ~200 RDKit descriptors
  
  # Output location
  output_file: "data/01_features/features.csv"
  
  # Performance settings
  n_jobs: -1  # Use all CPU cores
  chunk_size: 100

# ==================================================================
# STAGE 2: Preprocessing  
# ==================================================================
# Optional: Reduce dimensionality, scale features, etc.
# ⏱️  Takes: 30 seconds (reruns when you change settings)
# ==================================================================

preprocessing:
  # Input: Features from Stage 1
  input_file: "data/01_features/features.csv"
  
  # Remove features with very low variance (usually helpful)
  variance_threshold:
    enabled: true
    threshold: 0.01
  
  # Scale features to same range (usually helpful)  
  scaling:
    enabled: true
    method: "standard"  # Options: standard, minmax, robust
  
  # PCA dimensionality reduction (TUNE THIS!)
  pca:
    enabled: true           # ← Set to false to skip PCA
    n_components: 50        # ← Try: 20 (aggressive), 50 (balanced), 100 (conservative)
    # OR use variance threshold:
    # variance_threshold: 0.95  # Keep 95% of variance
  
  # Output location
  output_file: "data/02_processed/processed.csv"

# ==================================================================
# STAGE 3: Training
# ==================================================================
# Train neural network to predict target from features
# ⏱️  Takes: 2-5 minutes (reruns every time - fastest stage!)
# ==================================================================

training:
  # Input: Processed features from Stage 2
  input_file: "data/02_processed/processed.csv"
  target_column: "Target"
  
  # Data split
  train_test_split:
    test_size: 0.2      # 20% for final testing
    random_state: 42
  
  # Training parameters (TUNE THESE!)
  max_epochs: 50        # ← Try: 10 (quick), 50 (normal), 200 (thorough)
  batch_size: 64        # ← Try: 32 (more updates), 128 (faster)
  
  # Stop early if not improving (saves time!)
  early_stopping:
    enabled: true
    patience: 10        # Stop if no improvement for 10 epochs
    min_delta: 0.0001
  
  # Model architecture (TUNE THIS!)
  model:
    type: "feedforward"
    hidden_dims: [64, 32]   # ← Try: [32], [128,64], [128,64,32]
    dropout: 0.3            # ← Try: 0.0 (none), 0.3 (medium), 0.5 (high)
    activation: "relu"      # Options: relu, gelu, tanh
    
    # Optimizer settings (TUNE THIS!)
    optimizer:
      type: "adam"
      learning_rate: 0.001  # ← Try: 0.01 (fast), 0.001 (balanced), 0.0001 (careful)
      weight_decay: 0.0     # L2 regularization
  
  # Output location
  output_dir: "experiments/${experiment_name}"
  
  # Hardware
  accelerator: "auto"  # auto, gpu, mps (Mac), cpu
  precision: 32        # 32 (standard) or 16 (faster, less memory)

# ==================================================================
# Paths (Auto-generated - don't edit)
# ==================================================================
paths:
  root: ${oc.env:PWD}
  data: ${paths.root}/data
  experiments: ${paths.root}/experiments
