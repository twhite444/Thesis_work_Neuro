# Experiment Metadata# Paths Configuration

experiment_name: baseline  # Name for this run (creates folder in experiments/)paths:

seed: 42  # Random seed for reproducibility  project_root: "."  # Project root directory

  data_root: "data"  # Data storage

# Paths Configuration  output_dir: "experiments"  # Where results are saved

paths:  cache_dir: "data"  # Where cached data is stored

  project_root: "."  # Project root directory

  data_root: "data"  # Data storage# Defaults - These reference other config files

  output_dir: "experiments"  # Where results are saved# Students: Override these in your experiment configs

  cache_dir: "data"  # Where cached data is storeddefaults:

  data_dir: "data"  # Alias for data_root  - model: medium_net  # Which model architecture to use

  models_dir: "models"  # Saved models directory  - data: olfactory_default  # Which dataset to use

  - preprocessing: pca_default  # How to preprocess data

# Defaults - These reference the main config files  - training: default  # Training hyperparameters

# Override these in experiment configs  - _self_  # This file's settings take precedence

defaults:

  - model: model              # configs/model.yaml# Data Configuration (defaults, overridden by configs/data/*.yaml)

  - data: data                # configs/data.yamldata:

  - preprocessing: preprocessing  # configs/preprocessing.yaml  data_path: "data/00_raw/olfactory_v1.csv"  # Path to CSV file

  - training: training        # configs/training.yaml  target_column: "Target"  # Column name for prediction target

  - _self_                    # This file's settings take precedence  smiles_column: "SMILES"  # Column with molecular SMILES (optional)

  feature_columns: null  # null = use all except target/smiles

# Data Configuration (defaults from configs/data.yaml)  

# These can be overridden here or in experiment configs  # Train/test splitting

data:  train_test_split:

  data_path: "data/00_raw/olfactory_v1.csv"  # Path to CSV file    test_size: 0.2  # 20% for testing

  target_column: "Target"  # Column name for prediction target    random_state: ${seed}  # Use main seed

  smiles_column: "SMILES"  # Column with molecular SMILES (optional)    shuffle: true  # Shuffle before splitting

  feature_columns: null  # null = use all except target/smiles  

    # Data loading optimization

  # Train/test splitting  batch_size: 64  # Batch size for training

  train_test_split:  num_workers: 4  # Parallel data loading (0 = single thread)

    test_size: 0.2  # 20% for testing (legacy default)  pin_memory: true  # Faster GPU transfer

    val_size: 0.2   # 20% of train for validation  persistent_workers: true  # Keep workers alive between epochs

    random_state: ${seed}  # Use main seed

    shuffle: true  # Shuffle before splitting# Preprocessing Configuration (defaults, overridden by configs/preprocessing/*.yaml)

  preprocessing:

  # Data loading optimization  enabled: true  # Set false to skip all preprocessing

  batch_size: 32  # Batch size for training (legacy default)  cache: true  # Cache preprocessing results

  num_workers: 0  # Parallel data loading (0 = single thread, legacy default)  

  pin_memory: false  # Faster GPU transfer (legacy: false)  # Preprocessing steps (applied in order)

  persistent_workers: false  # Keep workers alive between epochs  methods:

    - type: variance_threshold  # Remove low-variance features

# Model Configuration (defaults from configs/model.yaml)      threshold: 0.01

model:    

  name: neural_network    - type: scaling  # Standardize features

  type: feedforward      method: standard  # Options: 'standard', 'minmax', 'robust'

  architecture:    

    hidden_layers: [128, 64]  # Legacy default    - type: pca  # Dimensionality reduction

    activation: relu      n_components: 50  # Or set 'variance_threshold: 0.95' for 95% variance

    dropout: 0.5  # Legacy default      # Set to null to disable PCA

    batch_norm: false  # Legacy default

  optimizer:# Model Configuration (defaults, overridden by configs/model/*.yaml)

    type: adammodel:

    learning_rate: 0.001  # Legacy default  type: feedforward  # Model type: 'feedforward', 'gnn' (future)

    weight_decay: 0.0  # Legacy default  

  loss: mse  architecture:

    hidden_layers: [128, 64, 32]  # List of layer sizes

# Preprocessing Configuration (defaults from configs/preprocessing.yaml)    activation: relu  # Activation function

preprocessing:    dropout: 0.3  # Dropout rate (0 = no dropout)

  enabled: true    batch_norm: false  # Use batch normalization

  methods:  

    - type: variance_threshold  optimizer:

      threshold: 1.0  # Legacy default    type: adam  # Optimizer: 'adam', 'sgd', 'adamw'

    - type: scaling    learning_rate: 0.001  # Learning rate

      method: standard  # Legacy default (StandardScaler)    weight_decay: 0.0  # L2 regularization

    # PCA is commented out - not used in legacy code  

    # - type: pca  loss: mse  # Loss function: 'mse', 'mae'

    #   n_components: 50

  cache: true# Training Configuration (defaults, overridden by configs/training/*.yaml)

training:

# Training Configuration (defaults from configs/training.yaml)  max_epochs: 100  # Maximum training epochs

training:  

  max_epochs: 50  # Legacy default  # Early stopping (saves time!)

  early_stopping:  early_stopping:

    enabled: true  # Recommended (not in legacy, but good practice)    enabled: true  # Stop if no improvement

    monitor: val_loss    monitor: val_loss  # Metric to monitor

    patience: 10    patience: 15  # Stop after N epochs without improvement

    min_delta: 0.0001    min_delta: 0.0001  # Minimum change to count as improvement

    mode: min    mode: min  # 'min' or 'max'

  checkpointing:  

    enabled: true  # Recommended (not in legacy)  # Checkpointing (save best models)

    monitor: val_loss  checkpointing:

    save_top_k: 3    enabled: true

    mode: min    monitor: val_loss

  accelerator: auto  # Auto-detect GPU (legacy: cpu)    save_top_k: 3  # Keep top 3 models

  devices: 1    mode: min

  precision: 32  # Legacy default  

  gradient_clip_val: 0.0  # Legacy default (no clipping)  # Hardware & Performance

  accumulate_grad_batches: 1  accelerator: auto  # 'auto', 'gpu', 'cpu'

  use_gpu: true  devices: 1  # Number of GPUs/CPUs to use

  val_metrics:  precision: 32  # Training precision: 32, 16 (mixed precision for speed)

    - mse  

    - mae  # Gradient optimization

    - r2  gradient_clip_val: 1.0  # Clip gradients (null = no clipping)

    - pearson_corr  accumulate_grad_batches: 1  # Gradient accumulation (1 = no accumulation)



# Logging Configuration# Logging Configuration

logging:logging:

  log_every_n_steps: 10  # How often to log metrics  log_every_n_steps: 10  # Log metrics every N batches

  enable_tensorboard: true  # Enable TensorBoard logging  enable_tensorboard: true  # Use TensorBoard logging

  enable_wandb: false  # Enable Weights & Biases logging (requires setup)  enable_wandb: false  # Use Weights & Biases (optional)

  log_metrics:  

    - train_loss  # What to log

    - val_loss  log_metrics:

    - val_correlation    - train_loss

    - val_loss

# Pipeline Configuration    - val_correlation  # Custom metric

pipeline:

  stages:# Pipeline Stages (for full pipeline runs)

    feature_extraction:pipeline:

      enabled: true  stages:

      cache: true    feature_extraction:

    preprocessing:      enabled: true

      enabled: ${preprocessing.enabled}      cache: true

      cache: ${preprocessing.cache}    

    training:    preprocessing:

      enabled: true      enabled: ${preprocessing.enabled}

      cache: false      cache: ${preprocessing.cache}

  force_recompute: false    

  recompute_stages: []    training:

      enabled: true

# Notes      cache: false  # Don't cache models

notes: |  

  Default configuration based on legacy code:  # Force recomputation

  - Model: [128, 64] hidden layers, dropout=0.5  force_recompute: false  # Set true to ignore cache

  - Preprocessing: variance threshold (1.0) + standard scaling  recompute_stages: []  # List specific stages to recompute

  - Training: 50 epochs, batch_size=32, lr=0.001

  - No PCA (legacy default)# Hydra Configuration (don't change unless you know what you're doing)

  hydra:

  To customize:  run:

    1. Copy configs/experiment/template.yaml    dir: ${paths.output_dir}/${experiment_name}  # Output directory

    2. Modify settings in your copy  sweep:

    3. Run with: python scripts/train.py experiment=your_experiment    dir: ${paths.output_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}

    subdir: ${hydra.job.num}

