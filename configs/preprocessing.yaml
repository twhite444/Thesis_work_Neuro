# ==================================================================
# Preprocessing Configuration
# ==================================================================
# Single preprocessing config with all options explained.
# Defaults are based on legacy code settings.
# ==================================================================

enabled: true

# Preprocessing Methods
# Applied in the order listed below
methods:
  # 1. Variance Threshold - Remove features with low variance
  - type: variance_threshold
    threshold: 1.0
  
  # 2. Scaling - Standardize features to zero mean and unit variance
  - type: scaling
    method: standard

  # PCA on features is disabled by default to preserve signal.
  # To enable later, add a method block like below in an experiment override:
  # - type: pca
  #   n_components: 50

# Caching
# Cache preprocessed data to speed up subsequent runs
# Legacy default: true (implied by saving cleaned_data.csv)
cache: true

# Data Quality Checks
# Automatically applied during preprocessing
checks:
  # Remove features with any NaN values
  # Legacy default: true (dropna in legacy code)
  drop_nan_features: true
  
  # Remove features with all zeros
  # Legacy default: true (filter zero-variance columns)
  drop_zero_features: true

# Metadata
description: "Standard preprocessing pipeline based on legacy code"
notes: |
  Legacy pipeline (basic_neural_pipeline.py):
  1. Generate Mordred features from SMILES
  2. Drop NaN columns and zero-variance columns
  3. Standardize with StandardScaler
  4. Apply variance threshold (1.0)
  5. Save to selected_features.csv

# ==================================================================
# USAGE EXAMPLES
# ==================================================================
#
# Legacy default (no PCA):
#   enabled: true
#   methods:
#     - type: variance_threshold
#       threshold: 1.0
#     - type: scaling
#       method: standard
#
# Minimal preprocessing (keep more features):
#   enabled: true
#   methods:
#     - type: variance_threshold
#       threshold: 0.01
#     - type: scaling
#       method: standard
#
# With PCA for dimensionality reduction:
#   enabled: true
#   methods:
#     - type: variance_threshold
#       threshold: 0.01
#     - type: scaling
#       method: standard
#     - type: pca
#       n_components: 50
#
# With aggressive PCA (keep 95% variance):
#   enabled: true
#   methods:
#     - type: variance_threshold
#       threshold: 0.01
#     - type: scaling
#       method: standard
#     - type: pca
#       n_components: 0.95
#
# No preprocessing (use raw features):
#   enabled: false
#   methods: []
# ==================================================================
