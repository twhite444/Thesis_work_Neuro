# ==================================================================
# Preprocessing Configuration
# ==================================================================
# Single preprocessing config with all options explained.
# Defaults are based on legacy code settings.
# ==================================================================

enabled: true

# Preprocessing Methods
# Applied in the order listed below
methods:
  # 1. Variance Threshold - Remove features with low variance
  #    Legacy default: threshold=1.0 (from select_features function)
  - type: variance_threshold
    # Minimum variance required to keep a feature
    # Legacy default: 1.0
    # Options:
    #   - 0.0:  Keep all features (no filtering)
    #   - 0.01: Remove near-constant features (minimal filtering)
    #   - 1.0:  Remove low-variance features (legacy default)
    #   - 2.0:  Aggressive filtering (keep only high-variance features)
    threshold: 1.0
  
  # 2. Scaling - Standardize features to zero mean and unit variance
  #    Legacy default: StandardScaler (always applied in legacy code)
  - type: scaling
    # Scaling method
    # Legacy default: standard (StandardScaler)
    # Options:
    #   - standard: Zero mean, unit variance (z-score normalization)
    #   - minmax:   Scale to [0, 1] range
    #   - robust:   Use median and IQR (robust to outliers)
    method: standard
  
  # 3. PCA - Dimensionality reduction (Optional)
  #    Legacy default: NOT USED in original basic_neural_pipeline.py
  #    Can be enabled for dimensionality reduction if needed
  # - type: pca
  #   # Number of principal components to keep
  #   # Options:
  #   #   - Integer (e.g., 50): Keep exactly 50 components
  #   #   - Float 0-1 (e.g., 0.95): Keep components explaining 95% variance
  #   n_components: 50
  #   
  #   # Whether to apply variance threshold before PCA
  #   variance_threshold_before_pca: true
  #   
  #   # Mask for selecting voxels (brain imaging specific)
  #   # null = use all features
  #   mask_path: null

# Caching
# Cache preprocessed data to speed up subsequent runs
# Legacy default: true (implied by saving cleaned_data.csv)
cache: true

# Data Quality Checks
# Automatically applied during preprocessing
checks:
  # Remove features with any NaN values
  # Legacy default: true (dropna in legacy code)
  drop_nan_features: true
  
  # Remove features with all zeros
  # Legacy default: true (filter zero-variance columns)
  drop_zero_features: true

# Metadata
description: "Standard preprocessing pipeline based on legacy code"
notes: |
  Legacy pipeline (basic_neural_pipeline.py):
  1. Generate Mordred features from SMILES
  2. Drop NaN columns and zero-variance columns
  3. Standardize with StandardScaler
  4. Apply variance threshold (1.0)
  5. Save to selected_features.csv

# ==================================================================
# USAGE EXAMPLES
# ==================================================================
#
# Legacy default (no PCA):
#   enabled: true
#   methods:
#     - type: variance_threshold
#       threshold: 1.0
#     - type: scaling
#       method: standard
#
# Minimal preprocessing (keep more features):
#   enabled: true
#   methods:
#     - type: variance_threshold
#       threshold: 0.01
#     - type: scaling
#       method: standard
#
# With PCA for dimensionality reduction:
#   enabled: true
#   methods:
#     - type: variance_threshold
#       threshold: 0.01
#     - type: scaling
#       method: standard
#     - type: pca
#       n_components: 50
#
# With aggressive PCA (keep 95% variance):
#   enabled: true
#   methods:
#     - type: variance_threshold
#       threshold: 0.01
#     - type: scaling
#       method: standard
#     - type: pca
#       n_components: 0.95
#
# No preprocessing (use raw features):
#   enabled: false
#   methods: []
# ==================================================================
