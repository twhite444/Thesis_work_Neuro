# @package _global_

# Brain Activity Prediction Experiment
# 
# Thesis replication: Predict brain PCA scores from molecular features
# Expected R² ≈ 0.506

defaults:
  - override /data: brain_activity
  - override /model: medium_net  # Start with medium network
  - override /training: default
  - override /preprocessing: none  # Data already preprocessed

# Experiment name
experiment_name: "brain_activity_baseline"

# Override model architecture for brain prediction
model:
  architecture:
    input_dim: 149  # Will be set automatically from data
    output_dim: 5   # Will be set automatically (5 brain PCs)
    hidden_layers: [512, 256, 128]  # Same as thesis
    activation: "relu"
    dropout: 0.3  # Changed from dropout_rate to dropout
    batch_norm: true  # Add BatchNorm (thesis architecture)
  
  # Loss function for multi-output regression
  loss:
    type: "mse"  # Mean Squared Error for regression
  
  # Optimizer
  optimizer:
    type: "adam"
    lr: 0.001
    weight_decay: 0.0001  # L2 regularization

# Training configuration
training:
  max_epochs: 200
  early_stopping:
    enabled: true
    patience: 20
    monitor: "val_loss"
    mode: "min"
  
  checkpointing:
    enabled: true
    monitor: "val_loss"
    mode: "min"
    save_top_k: 3
  
  use_gpu: true  # Use GPU/MPS if available
  precision: 32  # Full precision
  
  # Validation metrics
  val_metrics:
    - "mse"
    - "mae"
    - "r2"
    - "pearson_corr"

# Output paths
paths:
  output_dir: "experiments"
  data_dir: "data"
  models_dir: "models"

# Notes
notes: |
  Baseline experiment for brain activity prediction.
  
  Architecture:
    - Input: 149 molecular features (Mordred descriptors)
    - Hidden: [512, 256, 128] with BatchNorm, ReLU, Dropout
    - Output: 5 brain PCA scores
  
  Data:
    - 287 molecules total
    - Train/Val/Test split: 60/20/20
    - Features: Pre-standardized
    - Targets: Brain PCA scores (34.55% variance)
  
  Target Performance:
    - R² ≈ 0.506 (thesis benchmark)
    - PC1 predictions should be strongest (13.28% variance)
