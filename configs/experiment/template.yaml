# ==================================================================# 1. Copy this file: cp template.yaml my_experiment.yaml

# 2. Edit the settings below

# Experiment name - creates a folder with this name in experiments/# 3. Run: python scripts/train.py experiment=my_experiment

experiment_name: "my_experiment"# ==================================================================



# Defaults - Don't modify this section# Give your experiment a descriptive name

# These reference the main config files# This creates a folder: experiments/your_name_here/

defaults:experiment_name: my_experiment_name  # ← CHANGE THIS!

  - /model: model        # Use configs/model.yaml

  - /data: data          # Use configs/data.yaml# Choose which configurations to use

  - /preprocessing: preprocessing  # Use configs/preprocessing.yamldefaults:

  - /training: training  # Use configs/training.yaml  - /model: medium_net  # ← TRY: small_net, medium_net, large_net

  - _self_              # This file's settings override defaults  - /data: olfactory_default

  - /preprocessing: pca_default  # ← TRY: none, pca_default, pca_aggressive, variance_only

# Random seed for reproducibility  - /training: default  # ← TRY: quick_test, default, full_training

seed: 42  - _self_  # Keep this line



# ==================================================================# Random seed (change for different random initializations)

