# Test Data Configuration
name: test_data

# Data location
data_path: "data/00_raw/test_data.csv"

# Column configuration
target_column: "olfactory_intensity"
smiles_column: null  # No SMILES for synthetic data
feature_columns: null  # Use all numeric columns except target

# Columns to exclude
exclude_columns: []

# Data splitting
train_test_split:
  test_size: 0.2
  random_state: 42
  shuffle: true

# Data loading settings
batch_size: 16
num_workers: 0  # No parallel loading for quick test
pin_memory: false
persistent_workers: false

# Missing value handling
missing_values:
  strategy: "drop_rows"
